services:
  - type: web
    name: otto-lms
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.14.0"
      - key: MAX_SCORM_UPLOAD_MB
        value: "100"
      # Set these in the Render dashboard (do not commit secrets):
      # R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
      - key: R2_PREFIX
        value: courses
